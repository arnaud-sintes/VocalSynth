[package]
name = "vocalsynth"
version = "0.1.0"
edition = "2021"
description = "Text lines to WAV files using the built-in SAPI5 voices"

[[bin]]
name = "tts"
path = "src/main.rs"

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Media_Audio",
    "Win32_Media_Speech",
    "Win32_System_Com",
] }

[profile.release]
lto = true
strip = true
